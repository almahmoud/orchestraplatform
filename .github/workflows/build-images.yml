name: Build images (GHCR)

# Publishes the four Orchestra images to ghcr.io under whatever owner this repo
# belongs to, so a fork gets its own images with no setup. Auth is the built-in
# GITHUB_TOKEN. (deploy.yml is the upstream GCP pipeline; it needs Workload
# Identity secrets that a fork has no way to supply.)
#
# Note that GHCR packages are private on first push, so a cluster can't pull them
# until you flip each package to public or wire up an imagePullSecret.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # api and operator build from the repo root because both depend on the
          # sibling template-tools path package (ADR-0007). The other two are
          # self-contained.
          - image: orchestra-api
            context: .
            dockerfile: server/Dockerfile
          - image: orchestra-operator
            context: .
            dockerfile: operator/Dockerfile
          - image: orchestra-frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - image: orchestra-sidecar
            context: sidecar
            dockerfile: sidecar/Dockerfile

    steps:
      - uses: actions/checkout@v4

      # GHCR paths have to be lowercase; GitHub owners don't have to be.
      - name: Normalize owner to lowercase
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # A PR from a fork only gets a read-only token, and there's nothing to
        # push on a PR anyway.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest on the default branch, the git tag on v* tags, plus sha-<short>
      # on everything so a Helm revision can be pinned to a commit.
      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # amd64 only. Every target we support is x86_64, and the template
          # validator rejects non-amd64 images anyway.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
